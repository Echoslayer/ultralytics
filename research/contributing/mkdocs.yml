site_name: Ultralytics 開源貢獻研究手冊
site_description: 從議題、社群證據到第一個可驗證的小型貢獻
docs_dir: docs
site_dir: book
use_directory_urls: false
theme:
  name: material
  language: zh-TW
  font: false
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: 深色模式 }
    - scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: 淺色模式 }
  features: [navigation.sections, navigation.top, navigation.footer, content.code.copy, search.highlight]
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
extra_css:
  - assets/book.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - 導讀：先找到可重現的小問題: index.md
  - 1. 準備一筆小型貢獻: contribution-workflow.md
  - 2. 從症狀找到負責模組: codebase-map.md
  - 3. 七個議題與論壇案例: issues-and-community.md
  - 4. 選題與驗證步驟: roadmap.md
  - 5. 貢獻者身分與合併率: merge-rates.md
  - 6. 外部貢獻要先開單嗎？: ticket-requirements.md
  - 7. 貢獻的分布與範圍: contribution-distribution.md
  - 來源與查核限制: sources.md
